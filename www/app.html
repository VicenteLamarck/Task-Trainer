 const Qs=[L("¿Qué es lo que más te gusta de la app?","What do you like most about the app?","Qu'aimez-vous le plus ?","O que você mais gosta?"),L("¿Qué te frustra o te hace perder tiempo?","What frustrates you or wastes your time?","Qu'est-ce qui vous frustre ?","O que te frustra?"),L("¿Qué función añadirías? Sé concreto.","Which feature would you add? Be specific.","Quelle fonction ajouteriez-vous ?","Qual função adicionaria?"),L("Del 1 al 5, ¿cuánto recomendarías TaskTrainer?","From 1 to 5, how likely are you to recommend TaskTrainer?","De 1 à 5, recommanderiez-vous TaskTrainer ?","De 1 a 5, recomendaria o TaskTrainer?")];
 st.q=((st.q||0)+1)%Qs.length;return L("¡Gracias, lo anoté para el equipo! ","Thanks, I passed that to the team! ","Merci, transmis à l'équipe ! ","Obrigado, anotei para a equipe! ")+Qs[st.q]}
async function chat(role){const i=$("ci"),m=i.value.trim();if(!m)return;const arr=role==="a"?AC:st.chat;arr.push({r:"u",m});i.value="";render();
 let a=null;try{if(CFG.AI_URL)a=await askAI(role,m)}catch(e){}if(!a)a=role==="a"?adminBot(m):(userBot(m)||await collect(m));arr.push({r:"b",m:a});if(arr.length>24)arr.splice(0,arr.length-24);save();render()}
const chatView=r=>`<div class="card"><div class="chat" id="cb">${(r==="a"?AC:st.chat).map(x=>`<div class="${x.r==="u"?"um":"bm"}">${esc(x.m)}</div>`).join("")||`<p class="m">🤖 ${r==="a"?"Pregúntame por métricas, pagos o comentarios.":L("Hola 👋 Soy el asistente de TaskTrainer. Mi misión es mejorar la app contigo: cuéntame qué cambiarías o añadirías. También resuelvo dudas.","Hi 👋 I'm the TaskTrainer assistant. My mission is to improve the app with you: tell me what you would change or add. I also answer questions.","Bonjour 👋 Ma mission : améliorer l'app avec vous. Dites-moi ce que vous changeriez ou ajouteriez.","Olá 👋 Minha missão é melhorar o app com você: diga o que mudaria ou adicionaria.")}</p>`}</div>

async function recOk(uid){const r=RC.find(x=>x.uid===uid),o=AU.find(u=>u.phone===r.phone&&u.rc===r.code&&u.uid!==uid);if(!o)return;

async function schedNotifs(){const LN=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;if(!LN||!st.notif)return;
 try{const p=await LN.getPending();if(p.notifications.length)await LN.cancel({notifications:p.notifications});const n=[],now=NOW(),end=active(st)?st.until:st.created+CFG.TRIAL*DAY;
 SC.filter(x=>x.k.s-6e5>now).slice(0,30).forEach((x,i)=>n.push({id:100+i,title:"TaskTrainer",body:x.k.n+" · "+x.p.n,schedule:{at:new Date(x.k.s-6e5)}}));
 evNext(168).filter(e=>e.at-18e5>now).slice(0,20).forEach((e,i)=>n.push({id:300+i,title:"TaskTrainer",body:"🛡 "+e.n+" · "+L("en 30 min","in 30 min"),schedule:{at:new Date(e.at-18e5)}}));
 [3,1].forEach((d,i)=>{if(end-d*DAY>now)n.push({id:10+i,title:"TaskTrainer",body:L("Tu acceso a TaskTrainer vence en "+d+" día(s). Renueva para no perder tus datos.","Your TaskTrainer access ends in "+d+" day(s). Renew to keep going."),schedule:{at:new Date(end-d*DAY)}})});
 if(n.length)await LN.schedule({notifications:n})}catch(e){}}
async function notif(){const LN=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;try{if(LN)st.notif=(await LN.requestPermissions()).display==="granted";else if(window.Notification)st.notif=(await Notification.requestPermission())==="granted";else return alert("N/A")}catch(e){}save();render()}

let DR=null;const BOX=[0,0,1,3,7,15];
async function drillStart(docId,secId,pid,kid){const ids=docId?[docId]:(st.docs||[]).map(d=>d.id),cards=[],D={};
 for(const id of ids){const X=await IDB.get("doc:"+id);if(!X)continue;D[id]=X;const p=st.projects.find(x=>x.doc==id),ok=s=>!p||p.tasks.filter(k=>k.sec===s&&k.kind==="read").every(k=>k.done);
  X.cards.forEach(c=>{const hit=secId?(secId==="all"||c.s===secId):(c.due<=NOW()&&ok(c.s));if(hit)cards.push(Object.assign({},c,{doc:id}))})}
 cards.sort((a,b)=>a.due-b.due||a.id-b.id);DR={cards:cards.slice(0,secId==="all"?20:15),D,i:0,show:false,done:false,added:[],pid,kid};view="drill";render()}
function rate(q){const c=DR.cards[DR.i];c.r=q;c.n=(c.n||0)+1;if(q===2)c.box=Math.min(5,(c.box||1)+1);else if(q===0){c.box=1;c.f=(c.f||0)+1}c.due=q===0?NOW()+4*36e5:NOW()+Math.max(1,BOX[c.box])*DAY;DR.i++;DR.show=false;if(DR.i>=DR.cards.length)drillEnd();else render()}
async function drillEnd(){const bySec={},byDoc={};DR.cards.forEach(c=>{if(c.r===undefined)return;(byDoc[c.doc]=byDoc[c.doc]||[]).push(c);const k=c.doc+"|"+c.s,b=bySec[k]=bySec[k]||{n:0,f:0,doc:c.doc,s:c.s};b.n++;if(c.r===0)b.f++});
 for(const id in byDoc){const X=DR.D[id];byDoc[id].forEach(u=>{const c=X.cards.find(x=>x.id===u.id);if(c){c.box=u.box;c.due=u.due;c.f=u.f;c.n=u.n}});await IDB.set("doc:"+id,X)}
 for(const k in bySec){const b=bySec[k];if(b.n<3||b.f/b.n<.4)continue;const p=st.projects.find(x=>x.doc==b.doc),sec=DR.D[b.doc].secs.find(x=>x.id===b.s);if(!p||!sec||p.tasks.some(t=>!t.done&&t.kind==="reinf"&&t.sec===b.s))continue;
  const tk={id:NOW()+DR.added.length,n:`${L("Refuerzo","Reinforce")} · ${sec.n}: ${L("repasar págs","review pp.")} ${sec.a}–${sec.b}`,h:.33,done:false,note:L("Fallaste varias tarjetas de este tema: relee con calma lo que no entendiste.","You missed several cards on this topic: re-read calmly what you didn't understand."),kind:"reinf",doc:b.doc,sec:b.s,pa:sec.a,pb:sec.b,nb:+sod(new Date(NOW()+DAY))+st.cfg.w0*36e5},ix=p.tasks.findIndex(t=>!t.done&&(t.kind==="mock"||t.kind==="final"));
  if(ix<0)p.tasks.push(tk);else p.tasks.splice(ix,0,tk);DR.added.push(sec.n)}
 if(DR.pid){const p=st.projects.find(x=>x.id===DR.pid),k=p&&p.tasks.find(x=>x.id===DR.kid);if(k&&!k.done&&DR.cards.some(c=>c.r!==undefined)){k.done=true;st.done.push({t:NOW(),h:k.h,id:k.id})}}
 save();DR.done=true;await refreshDue();render()}
const drillView=()=>{const n=DR.cards.length;let b;
 if(!n)b=`<p>${L("No hay tarjetas para repasar ahora. Cuando termines de leer un tema aparecerán aquí.","No cards to review right now. They show up here once you finish reading a topic.")}</p>`;
 else if(DR.done){const ok=DR.cards.filter(c=>c.r===2).length,mid=DR.cards.filter(c=>c.r===1).length,bad=DR.cards.filter(c=>c.r===0).length;b=`<h3>🎉 ${L("Sesión terminada","Session finished")}</h3><div class="mt"><div>✓ ${L("Lo sabía","Knew it")}<b>${ok}</b></div><div>~ ${L("Dudé","Unsure")}<b>${mid}</b></div><div>✗ ${L("Fallé","Missed")}<b>${bad}</b></div></div>${DR.added.length?`<p style="color:var(--y)">➕ ${L("Añadí un refuerzo a tu plan para: ","I added a reinforcement to your plan for: ")}${esc(DR.added.join(", "))}</p>`:""}`}
 else{const c=DR.cards[DR.i];b=`<p class="m">${DR.i+1} / ${n} · ${c.t==="d"?L("Definición","Definition"):L("Completar","Fill in")}</p><div class="card" style="font-size:1.05rem;line-height:1.5">${esc(c.q)}</div>${DR.show?`<div class="card G" style="line-height:1.5">${esc(c.a)}</div><div class="row"><button class="r" onclick="rate(0)">✗ ${L("Fallé","Missed")}</button><button class="s" onclick="rate(1)">~ ${L("Dudé","Unsure")}</button><button class="g" onclick="rate(2)">✓ ${L("Lo sabía","Knew it")}</button></div>`:`<button onclick="DR.show=true;render()">${L("Mostrar respuesta","Show answer")}</button>`}`}
 return header()+`<div class="card"><div class="row"><b>🃏 ${L("Repaso","Review")}</b><button class="s" onclick="drillQuit()">${t("back")}</button></div>${b}</div>`};

async function bioAvail(){try{const b=BIO();if(!NATIVE||!b)return false;const r=await b.isAvailable();return!!(r&&r.isAvailable)}catch(e){return false}}
async function offerBio(ph,pw){if(st.bio||!(await bioAvail()))return;if(!confirm(L("¿Activar la huella para entrar más rápido como administrador?","Enable fingerprint for faster admin sign-in?")))return;try{await BIO().setCredentials({username:ph,password:pw,server:"tasktrainer.admin"});st.bio=1;save();toast(L("Huella activada ✔","Fingerprint enabled ✔"))}catch(e){toast(L("No se pudo activar la huella","Could not enable fingerprint"))}}
async function bioOff(){try{await BIO().deleteCredentials({server:"tasktrainer.admin"})}catch(e){}st.bio=0;save();render();toast(L("Huella desactivada","Fingerprint disabled"))}
async function adminBio(){try{const b=BIO();await b.verifyIdentity({reason:L("Entrar como administrador","Sign in as admin"),title:"TaskTrainer"});const c=await b.getCredentials({server:"tasktrainer.admin"});await adminLogin({ph:c.username,pw:c.password})}catch(e){aerr(L("Huella no reconocida","Fingerprint not recognized"))}}
const aerr=m=>{const e=$("aerr");if(e)e.textContent=m;else toast(m)};
const FBERR=e=>{const m=String(e&&e.error&&e.error.message||e||"");return/INVALID_LOGIN|INVALID_PASSWORD|EMAIL_NOT_FOUND|INVALID_EMAIL/.test(m)?L("Teléfono o contraseña incorrectos","Wrong phone or password"):/TOO_MANY/.test(m)?L("Demasiados intentos. Espera unos minutos.","Too many attempts. Wait a few minutes."):/WEAK_PASSWORD/.test(m)?L("La contraseña es muy corta (mínimo 8 caracteres)","Password too short (min 8 characters)"):m==="noadmin"?L("Esta cuenta no tiene permisos de administrador","This account has no admin permissions"):/NETWORK|Failed to fetch|fetch/i.test(m)?L("Sin conexión","No connection"):L("No se pudo entrar","Could not sign in")};
async function adminLogin(bio){const ph=bio?bio.ph:($("ap0")?$("ap0").value.trim():""),pw=bio?bio.pw:$("ap").value;
 try{if(CFG.DB){if(!ph||!pw)return aerr(L("Escribe tu teléfono y tu contraseña","Enter your phone and password"));
   const j=await fj(KURL+"signInWithPassword?key="+CFG.API_KEY,{email:adminEmail(ph),password:pw,returnSecureToken:true});A.a={t:j.idToken,rt:j.refreshToken,exp:NOW()+j.expiresIn*1e3,id:j.localId};A.email=j.email;
   ROLE=await api("admins/"+j.localId,"GET",0,1);if(!ROLE)throw"noadmin";if(!bio&&NATIVE)offerBio(ph,pw)}
  else{if(pw!==CFG.ADMIN_PIN)throw"pin";ROLE=true}
  adminOK=true;view="admin";await loadAdmin()}catch(x){aerr(x==="pin"?L("PIN incorrecto","Wrong PIN"):FBERR(x));if($("ap"))$("ap").value=""}}
async function adminSetup(){const n=$("as0").value.trim(),ph=$("ap0").value.trim(),pw=$("ap").value,pw2=$("ap2").value,code=$("ac").value.trim();
 if(n.length<2||ph.replace(/\D/g,"").length<6)return aerr(L("Escribe tu nombre y tu teléfono","Enter your name and phone"));if(pw.length<8)return aerr(L("La contraseña debe tener al menos 8 caracteres","Password must have at least 8 characters"));if(pw!==pw2)return aerr(L("Las contraseñas no coinciden","Passwords do not match"));if(!code)return aerr(L("Escribe el código de configuración","Enter the setup code"));
 try{let j;try{j=await fj(KURL+"signUp?key="+CFG.API_KEY,{email:adminEmail(ph),password:pw,returnSecureToken:true})}catch(e){if(/EMAIL_EXISTS/.test(JSON.stringify(e)))j=await fj(KURL+"signInWithPassword?key="+CFG.API_KEY,{email:adminEmail(ph),password:pw,returnSecureToken:true});else throw e}
  const put=async(p,b)=>{const r=await fetch(`${CFG.DB}/${p}.json?auth=${j.idToken}`,{method:"PUT",body:JSON.stringify(b)});if(!r.ok)throw"claim"};
  await put("adminSetup/"+j.localId,{k:code,n});await put("admins/"+j.localId,true);
  A.a={t:j.idToken,rt:j.refreshToken,exp:NOW()+j.expiresIn*1e3,id:j.localId};A.email=j.email;ROLE=true;adminOK=true;view="admin";AMODE="in";if(NATIVE)offerBio(ph,pw);await loadAdmin()}
 catch(x){aerr(x==="claim"?L("Código incorrecto, o ya existe un administrador","Wrong code, or an administrator already exists"):FBERR(x))}}

async function loadAdmin(){try{AU=kv(await api("users","GET",0,1));FB=kv(await api("feedback","GET",0,1)).map(f=>Object.assign(f,{rating:Math.min(5,Math.max(0,Math.round(+f.rating)||0))}));RC=kv(await api("recover","GET",0,1));CP=kv(await api("coupons","GET",0,1)).map(c=>Object.assign(c,{code:c.uid,pct:Math.min(100,Math.max(0,+c.pct||0)),max:+c.max||0,used:+c.used||0}));AUD=[];if(ROLE===true)try{AUD=vals(await api("audit","GET",0,1)).filter(Boolean).sort((a,b)=>b.t-a.t).slice(0,15)}catch(e){}CF=await api("config","GET",0,1)||{};if(CF.price)CFG.PRICE=CF.price;if(CF.payNum)CFG.PAY_NUM=CF.payNum}catch(e){AU=[];FB=[]}render()}
async function decide(uid,ok){const u=AU.find(x=>x.uid===uid);if(!u)return;
 if(ok){const P=pl(u),first=!vals(u.pay).length,c=CP.find(x=>x.code===u.coupon),use=c&&c.used<c.max,a=due(u);
  await api("users/"+uid,"PATCH",{status:"active",until:Math.max(NOW(),u.until||0)+P.d*DAY,pay:vals(u.pay).concat({t:NOW(),a,r:u.ref||"",m:u.method||"",p:P.id}),note:""},1);
  if(use)await api("coupons/"+c.code,"PATCH",{used:c.used+1},1);
  if(first&&u.refBy){const rf=AU.find(x=>x.uid!==u.uid&&x.uid.slice(0,6).toUpperCase()===u.refBy);if(rf)await api("users/"+rf.uid,"PATCH",{until:Math.max(NOW(),rf.until||0)+7*DAY,status:rf.status==="pending"?"pending":"active"},1)}
  logA("pago aprobado",u.name,a+" "+CFG.CUR+" · plan "+P.id+(use?" · cupón "+c.code:""))}
 else{const r=prompt("Motivo del rechazo (lo verá el usuario):","");if(r===null)return;await api("users/"+uid,"PATCH",{status:active(u)?"active":u.until?"expired":"none",note:r||"Pago no verificado"},1);logA("pago rechazado",u.name,r)}
 loadAdmin()}
async function grant(uid){const u=AU.find(x=>x.uid===uid),d=parseInt(prompt("Días a añadir (negativo para quitar):","30"));if(!d)return;await api("users/"+uid,"PATCH",d>0?{until:Math.max(NOW(),u.until||0)+d*DAY,status:"active"}:{until:(u.until||NOW())+d*DAY},1);logA("ajuste de días",u.name,(d>0?"+":"")+d);loadAdmin()}
async function blk(uid){const u=AU.find(x=>x.uid===uid);await api("users/"+uid,"PATCH",{blocked:u.blocked?0:1},1);logA(u.blocked?"desbloqueo":"bloqueo",u.name);loadAdmin()}
